name: InstallLinkShortener
description: Installs Flask-based URL Shortener app
schemaVersion: 1.0
phases:
  - name: build
    steps:
      - name: InstallDependencies
        action: ExecuteBash
        inputs:
          commands:
            - yum update -y
            - yum install -y python3 python3-pip
            - pip3 install flask sqlalchemy gunicorn
      - name: CopyApp
        action: ExecuteBash
        inputs:
          commands:
            - mkdir -p /opt/linkshortener
            - cp -r /tmp/LinkShortener/* /opt/linkshortener/
      - name: SetUpService
        action: ExecuteBash
        inputs:
          commands:
            - echo "[Unit]\nDescription=LinkShortener Flask App\nAfter=network.target\n\n[Service]\nExecStart=/usr/local/bin/gunicorn --workers 3 --bind 0.0.0.0:80 -m 007 main:app\nWorkingDirectory=/opt/linkshortener\nRestart=always\nUser=ec2-user\n\n[Install]\nWantedBy=multi-user.target" > /etc/systemd/system/linkshortener.service
            - systemctl enable linkshortener.service
            - systemctl start linkshortener.service
