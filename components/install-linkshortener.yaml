name: InstallLinkShortener
description: Installs and configures LinkShortener Flask app on Ubuntu
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: UpdateSystem
        action: ExecuteBash
        inputs:
          commands:
            - apt update -y && apt upgrade -y

      - name: InstallDependencies
        action: ExecuteBash
        inputs:
          commands:
            - apt install -y python3 python3-pip git
            - pip3 install flask

      - name: CloneApp
        action: ExecuteBash
        inputs:
          commands:
            - git clone https://github.com/AsadlikesLearning/LinkShortener.git /opt/linkshortener

      - name: CreateSystemdService
        action: ExecuteBash
        inputs:
          commands:
            - |
              echo "[Unit]
              Description=LinkShortener Flask App
              After=network.target

              [Service]
              ExecStart=/usr/bin/python3 /opt/linkshortener/app.py
              WorkingDirectory=/opt/linkshortener
              Restart=always
              User=ubuntu

              [Install]
              WantedBy=multi-user.target" | tee /etc/systemd/system/linkshortener.service

            - systemctl daemon-reexec
            - systemctl daemon-reload
            - systemctl enable linkshortener.service
